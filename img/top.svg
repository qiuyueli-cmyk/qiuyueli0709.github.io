<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9F0"/>
      <stop offset="60%" stop-color="#FFD0DF"/>
      <stop offset="100%" stop-color="#FFB3CA"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#sky)"/>

  <!-- 云朵 -->
  <g fill="#ffffff" opacity="0.7">
    <ellipse cx="280" cy="150" rx="150" ry="55"/>
    <ellipse cx="360" cy="130" rx="110" ry="45"/>
    <ellipse cx="205" cy="130" rx="95" ry="40"/>
    <ellipse cx="1500" cy="200" rx="170" ry="60"/>
    <ellipse cx="1600" cy="175" rx="120" ry="48"/>
    <ellipse cx="1400" cy="180" rx="100" ry="42"/>
  </g>

  <!-- 樱花花瓣 -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="150" cy="420" r="10"/>
    <circle cx="180" cy="470" r="8"/>
    <circle cx="120" cy="510" r="6"/>
    <circle cx="1780" cy="430" r="9"/>
    <circle cx="1750" cy="490" r="7"/>
    <circle cx="1820" cy="520" r="5"/>
    <circle cx="950" cy="520" r="8"/>
    <circle cx="1000" cy="560" r="5"/>
  </g>
  <g fill="#FF9EBC" opacity="0.5">
    <circle cx="1600" cy="470" r="6"/>
    <circle cx="200" cy="380" r="5"/>
    <circle cx="900" cy="470" r="6"/>
  </g>

  <!-- 底部柔和过渡 -->
  <rect y="560" width="1920" height="40" fill="#FFB3CA" opacity="0.35"/>
</svg>
